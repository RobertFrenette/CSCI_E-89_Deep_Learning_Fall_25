{% extends "base.html" %}

{% block title %}Register - AI Agent Insurance{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="glass-effect rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <img src="{{ url_for('static', filename='shield.png') }}" alt="Logo" class="mx-auto h-16 w-16 mb-4">
                <h2 class="text-3xl font-bold text-white">Create Account</h2>
                <p class="mt-2 text-gray-200">Register with your policy information</p>
            </div>
            
            <form method="POST" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-white mb-2">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        minlength="3"
                        autocomplete="username"
                        class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent"
                        placeholder="Choose a username"
                    >
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-white mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        autocomplete="email"
                        class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent"
                        placeholder="your.email@example.com"
                    >
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-white mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="8"
                        autocomplete="new-password"
                        class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent"
                        placeholder="Minimum 8 characters"
                    >
                </div>
                
                <div>
                    <label for="policy_number" class="block text-sm font-medium text-white mb-2">Policy Number</label>
                    <input 
                        type="text" 
                        id="policy_number" 
                        name="policy_number" 
                        required
                        class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent"
                        placeholder="Your policy number"
                    >
                    <p class="mt-1 text-xs text-gray-300">Enter the policy number associated with your email</p>
                </div>
                
                <div>
                    <button 
                        type="submit"
                        class="w-full bg-white text-purple-600 py-3 px-4 rounded-lg font-semibold hover:bg-gray-100 transition duration-200 shadow-lg hover:shadow-xl"
                    >
                        Create Account
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-200">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-white font-semibold hover:underline">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
