{% extends "base.html" %}

{% block title %}Submit Claim - AI Agent Insurance{% endblock %}

{% block content %}
<!-- Navigation -->
<nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-8">
                <img src="{{ url_for('static', filename='shield.png') }}" alt="Logo" class="h-8 w-8">
                <a href="{{ url_for('dashboard') }}" class="text-gray-700 hover:text-purple-600">Dashboard</a>
                <a href="{{ url_for('policies') }}" class="text-gray-700 hover:text-purple-600">Policies</a>
                <a href="{{ url_for('claims') }}" class="text-purple-600 font-semibold">Claims</a>
                <a href="{{ url_for('profile') }}" class="text-gray-700 hover:text-purple-600">Profile</a>
            </div>
            <div class="flex items-center">
                <a href="{{ url_for('logout') }}" class="text-gray-700 hover:text-purple-600">Logout</a>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Submit a Claim</h1>
        <p class="text-gray-600 mt-2">File a new insurance claim for your policy</p>
    </div>
    
    <div class="bg-white rounded-xl shadow-lg p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label for="policy_number" class="block text-sm font-medium text-gray-700 mb-2">Policy Number *</label>
                <select 
                    id="policy_number" 
                    name="policy_number" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                >
                    <option value="">Select a policy</option>
                    {% for policy in policies %}
                    <option value="{{ policy.policy_number }}">{{ policy.policy_number }} - {{ policy.policy_type }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="claim_type" class="block text-sm font-medium text-gray-700 mb-2">Claim Type *</label>
                <select 
                    id="claim_type" 
                    name="claim_type" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                >
                    <option value="">Select claim type</option>
                    <option value="Property Damage">Property Damage</option>
                    <option value="Liability">Liability</option>
                    <option value="Data Breach">Data Breach</option>
                    <option value="System Failure">System Failure</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div>
                <label for="claim_amount" class="block text-sm font-medium text-gray-700 mb-2">Claim Amount ($) *</label>
                <input 
                    type="number" 
                    id="claim_amount" 
                    name="claim_amount" 
                    required
                    min="0"
                    step="0.01"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="0.00"
                >
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea 
                    id="description" 
                    name="description" 
                    rows="5"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="Please provide details about your claim..."
                ></textarea>
            </div>
            
            <div class="flex items-center justify-between pt-4">
                <a href="{{ url_for('dashboard') }}" class="text-gray-600 hover:text-gray-900">Cancel</a>
                <button 
                    type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-purple-500 to-purple-600 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-purple-700 transition duration-200 shadow-lg hover:shadow-xl"
                >
                    Submit Claim
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
