services:
  postgres:
    image: postgres:15-alpine
    container_name: insure-postgres
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: insure_admin
      POSTGRES_PASSWORD: insure_secure_pass_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database-init/postgres:/docker-entrypoint-initdb.d
    networks:
      - insure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insure_admin -d insurance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: insure-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_secure_pass_2025
      MONGO_INITDB_DATABASE: insurance_users
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./database-init/mongodb:/docker-entrypoint-initdb.d
    networks:
      - insure-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: insure-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    networks:
      - insure-network
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE

  admin-backend:
    build:
      context: ./admin-app/backend
      dockerfile: Dockerfile
      target: production
    container_name: insure-admin-backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - insure-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  admin-frontend:
    build:
      context: ./admin-app/frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_AI_AGENT_URL: ${NEXT_PUBLIC_AI_AGENT_URL:-http://localhost:8002}
    container_name: insure-admin-frontend
    env_file:
      - .env
    environment:
      # For server-side rendering, use Docker service name
      ADMIN_BACKEND_URL: http://admin-backend:3001
      AI_AGENT_URL: http://ai-agent:8002
      # For client-side, use localhost (set as build arg)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_AI_AGENT_URL: ${NEXT_PUBLIC_AI_AGENT_URL:-http://localhost:8002}
    ports:
      - "3000:3000"
    networks:
      - insure-network
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  client-backend:
    build:
      context: ./client-app/backend
      dockerfile: Dockerfile
      target: production
    container_name: insure-client-backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    networks:
      - insure-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  client-frontend:
    build:
      context: ./client-app/frontend
      dockerfile: Dockerfile
      target: production
    container_name: insure-client-frontend
    env_file:
      - .env
    environment:
      CLIENT_BACKEND_URL: http://client-backend:8001
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "5001:5000"
    networks:
      - insure-network
    depends_on:
      client-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: insure-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - insure-network
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
      target: production
    container_name: insure-ai-agent
    env_file:
      - .env
    ports:
      - "8002:8002"
    networks:
      - insure-network
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - CHROMADB_USE_HTTP=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=phi3:mini
      - MONGO_HOST=mongodb
      - MONGO_ROOT_USER=mongo_admin
      - MONGO_ROOT_PASSWORD=mongo_secure_pass_2025
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=insurance_db
      - POSTGRES_USER=insure_admin
      - POSTGRES_PASSWORD=insure_secure_pass_2025
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  insure-dashboard:
    build:
      context: ./insure-dashboard
      dockerfile: Dockerfile
    container_name: insure-dashboard
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs:ro
    networks:
      - insure-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
      admin-backend:
        condition: service_healthy
      client-backend:
        condition: service_healthy
      ollama:
        condition: service_started
      ai-agent:
        condition: service_healthy
    environment:
      - ENVIRONMENT=container
      - POSTGRES_HOST=postgres
      - MONGODB_HOST=mongodb
      - CHROMADB_HOST=chromadb
      - ADMIN_BACKEND_URL=http://admin-backend:3001
      - CLIENT_BACKEND_URL=http://client-backend:8001
      - AI_AGENT_URL=http://ai-agent:8002
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMADB_BASE_URL=http://chromadb:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
  mongo-data:
  chromadb-data:
  ollama-models:

networks:
  insure-network:
    external: true
